spring:
  application:
    name: jojopay
  cloud:
    aws:
      region:
        static: ap-northeast-2
  profiles:
    active: prod

portone:
  secret-key: "MP42bGdUPcTmnU98YXpWCEtLBP26DUqU1WATn20ipyW2HcL3BBwrx7V7nTFQJRPa3V3bbTVKFZjpWxLT"
  api-url: "https://api.portone.io"

---

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:jojopay_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always

jwt:
  secret-key: localEnvDummySecretKeyForJojoPayProjectTest12345!
  access-token-valid-time: 36000000

---
spring:
  config:
    activate:
      on-profile: prod
    import: aws-parameterstore:/config/jojopay/

  # [추가/수정된 데이터베이스 설정]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # url, username, password는 aws-parameterstore를 통해 로드되도록 설정

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  # [초기화 스크립트 실행 방지]
  sql:
    init:
      mode: never

  # [H2 콘솔 끄기]
  h2:
    console:
      enabled: false

  jackson:
    time-zone: Asia/Seoul

server:
  address: 0.0.0.0
  port: 8080

jwt:
  access-token-valid-time: 3600000