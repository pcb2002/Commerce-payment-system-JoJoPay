spring:
  application:
    name: jojopay
  cloud:
    aws:
      region:
        static: ap-southeast-2
  profiles:
    active: local

---

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:jojopay_db;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
jwt:
  secret-key: localEnvDummySecretKeyForJojoPayProjectTest12345!
  access-token-valid-time: 36000000

---

spring:
  config:
    activate:
      on-profile: prod
    import: aws-parameterstore:/config/jojopay/ # AWS에서 파라미터들을 싹 긁어옵니다.
  jpa:
    hibernate:
      ddl-auto: update
  Jackson:
    time-zone: Asia/Seoul

jwt:
  secret-key: ${jwt.secret-key}
  access-token-valid-time: 3600000

portone:
  secret-key: ${portone.secret-key}