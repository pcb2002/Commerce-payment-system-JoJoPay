name: JojoPay CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write    # Qodana 분석 리포트 작성 권한
  pull-requests: write
  checks: write

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 소스코드 전체 이력 가져오기
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: 자바 17 환경 구축
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      # Step 3: Gradle 빌드 캐싱
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 4: 실행 권한 부여 및 테스트 가동 (CI 핵심 검증)
#      - name: Grant execute permission for gradlew
#        run: chmod +x gradlew

#      - name: Run tests
#        run: ./gradlew test 

      # 🔍 Step 5: Qodana 정적 코드 분석 수행
      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2025.3
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: false

      # Step 6: 최종 배포용 JAR 파일 빌드 (테스트는 위에서 했으므로 제외하고 빠르게 빌드)
      - name: Build JAR
        run: ./gradlew bootJar -x test

      # 🚀 Step 7: [CD] 빌드된 JAR 파일을 실제 AWS EC2 서버로 전송하기
      - name: Copy JAR to EC2
      # always() &&는 배포 테스트를 위해 설정. 최종 때 지움
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*-SNAPSHOT.jar"
          target: "~/jojopay-backend"
          strip_components: 0

      # 🏃‍♂️ Step 8: [CD] EC2 서버에서 기존 프로세스를 끄고 새 JAR 파일 실행하기
      # SSM(Systems Manager) 활용
      - name: Deploy via AWS SSM
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Run deploy script
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands=["cd ~/jojopay-backend && nohup java -jar jojopay-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod > nohup.out 2>&1 &"]
