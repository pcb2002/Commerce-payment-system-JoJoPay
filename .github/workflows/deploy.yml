name: JojoPay CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 소스코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: 빌드 환경 구축 (Java & Node.js)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Step 3: 프론트엔드 빌드
      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      # Step 4: Gradle 빌드 캐싱
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 5: Qodana 정적 코드 분석
      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2025.3
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 6: 백엔드 JAR 빌드
      - name: Build JAR
        run: ./gradlew bootJar -x test

      # Step 7: 빌드된 결과물(프론트+백엔드) S3 업로드
      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2
        run: |
          # 프론트엔드 빌드 결과물(보통 build 또는 dist 폴더)
          aws s3 sync frontend/build/ s3://camp-health-qkrcoqls-files/frontend/
          # 백엔드 JAR 파일
          aws s3 cp build/libs/*-SNAPSHOT.jar s3://camp-health-qkrcoqls-files/deploy/app.jar

      # Step 8: 배포 및 헬스 체크
      - name: Deploy via AWS SSM
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Run deploy script
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws s3 cp s3://camp-health-qkrcoqls-files/deploy/app.jar /home/ec2-user/jojopay-backend/app.jar --region ap-northeast-2",
              "aws s3 sync s3://camp-health-qkrcoqls-files/frontend/ /var/www/html/frontend/",
              "sudo -u ec2-user bash -c \"fuser -k 8080/tcp || true\"",
              "sudo -u ec2-user bash -c \"cd /home/ec2-user/jojopay-backend && nohup java -jar app.jar --spring.profiles.active=prod > nohup.out 2>&1 &\"",
              "echo \"> 서버 구동 확인 중...\"",
              "for RETRY_COUNT in {1..10}; do RESPONSE=$(curl -s http://localhost:8080/health); if [ \"$RESPONSE\" = \"OK\" ]; then echo \"> 서버 구동 성공!\"; break; else echo \"> 서버가 아직 안 떴습니다. 10초 대기 중... ($RETRY_COUNT/10)\"; sleep 10; fi; done"
            ]'