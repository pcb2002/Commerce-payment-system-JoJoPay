name: JojoPay CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write    # Qodana 분석 리포트 작성 권한
  pull-requests: write
  checks: write

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 소스코드 전체 이력 가져오기
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: 자바 17 환경 구축
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      # Step 3: Gradle 빌드 캐싱
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Step 4: 실행 권한 부여 및 테스트 가동 (CI 핵심 검증)
#      - name: Grant execute permission for gradlew
#        run: chmod +x gradlew

#      - name: Run tests
#        run: ./gradlew test 

      # 🔍 Step 5: Qodana 정적 코드 분석 수행
      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2025.3
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 6: 최종 배포용 JAR 파일 빌드 (테스트는 위에서 했으므로 제외하고 빠르게 빌드)
      - name: Build JAR
        run: ./gradlew bootJar -x test

      # 🚀 Step 7: [CD] 빌드된 JAR 파일을 S3로 업로드
      - name: Upload JAR to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-northeast-2
        run: |
          aws s3 cp build/libs/*-SNAPSHOT.jar s3://camp-health-qkrcoqls-files/app.jar

      # 🏃‍♂️ Step 8: [CD] EC2가 S3에서 파일을 다운로드 후 실행
      - name: Deploy via AWS SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws s3 cp s3://jojopay-deploy-bucket/app.jar /home/ec2-user/jojopay-backend/app.jar",
              "sudo -u ec2-user bash -c \"fuser -k 8080/tcp || true\"",
              "sudo -u ec2-user bash -c \"cd /home/ec2-user/jojopay-backend && nohup java -jar app.jar --spring.profiles.active=prod > nohup.out 2>&1 &\""
            ]'

      - name: Run deploy script
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"sudo -u ec2-user bash -c 'fuser -k 8080/tcp || true'\", \"sudo -u ec2-user bash -c 'cd /home/ec2-user/jojopay-backend && nohup java -jar *.jar --spring.profiles.active=prod > nohup.out 2>&1 &' \"]"
